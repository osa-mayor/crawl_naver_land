name: Monthly Region Validator

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-regions:
    runs-on: [self-hosted, macOS]
    defaults:
      run:
        shell: bash
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dependencies
        run: |
          python3 -m pip install pandas playwright
          python3 -m playwright install chromium

      - name: Run Region Validator
        run: |
          python3 region_validator.py

      - name: Commit and Push Changes
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add naver_region_codes.json
          if ! git diff --staged --quiet; then
            git commit -m "Update region validity: $(date +'%Y-%m-%d')"
            git push
          else
            echo "No changes in region validity."
          fi
