name: Test Google Drive Upload ONLY

on:
  workflow_dispatch:

jobs:
  test-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Create Dummy File
        run: echo "GitHub Actions Test File - If you see this, Auth is working!" > test_gha_upload.txt

      - name: Upload to Drive
        env:
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python upload_drive.py --files test_gha_upload.txt --folder "$GDRIVE_FOLDER_ID" --token "$GDRIVE_TOKEN"
