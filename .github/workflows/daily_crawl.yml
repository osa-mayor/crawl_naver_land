name: Daily Land Crawler

on:
  schedule:
    # KST 01:00 AM = UTC 16:00 PM (Previous Day)
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  crawl:
    name: Crawl ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Seoul"
            id: "seoul"
            regions: "서울시"
          - name: "Gyeonggi"
            id: "gyeonggi"
            regions: "경기도"
          - name: "Metros"
            id: "metros"
            regions: "인천시 부산시 대구시 광주시 대전시 울산시 세종시"
          - name: "Provinces"
            id: "provinces"
            regions: "강원도 충청북도 충청남도 전라북도 전라남도 경상북도 경상남도 제주도"

    steps:
      - name: Checkout Public Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache Python packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Playwright browsers
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/requirements.txt') }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: |
          playwright install chromium
          playwright install-deps

      - name: Run Crawler
        env:
          MAX_CONCURRENT_PAGES: 5
        run: |
          echo "🚀 Processing Regions: ${{ matrix.regions }}"
          python crawler.py --regions ${{ matrix.regions }} --db-path db_${{ matrix.id }}.db

      - name: Upload Partial DB
        uses: actions/upload-artifact@v4
        with:
          name: partial-db-${{ matrix.id }}
          path: db_${{ matrix.id }}.db
          retention-days: 1

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.id }}
          path: crawling_db.log


  archive-and-backup:
    needs: crawl
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout Public Code (for scripts)
        uses: actions/checkout@v4

      - name: Checkout Private DB Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO_NAME }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: private_db

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Download All Partial DBs
        uses: actions/download-artifact@v4
        with:
          pattern: partial-db-*
          merge-multiple: true

      - name: Check Crawl Status
        id: check_status
        run: |
          if compgen -G "db_*.db" > /dev/null; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "db_count=$(ls db_*.db | wc -l)" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "db_count=0" >> $GITHUB_OUTPUT
          fi

      - name: 1. Generate Excel Files (Skip if failed)
        id: gen_excel
        if: steps.check_status.outputs.status == 'success'
        continue-on-error: true
        run: |
          echo "📊 Generating Excel files from Partial DBs..."
          for db_file in db_*.db; do
            id_name=$(echo "$db_file" | sed 's/^db_//' | sed 's/\.db$//')
            date_str=$(date +'%Y-%m-%d')
            excel_name="${date_str}_${id_name}.xlsx"
            python export_db.py "$db_file" --output "$excel_name"
          done

      - name: 2. Archive to Private GitHub Repo (Split DBs)
        if: steps.check_status.outputs.status == 'success'
        continue-on-error: true
        run: |
          cp db_*.db private_db/
          cd private_db
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add db_*.db
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update DBs: $(date +'%Y-%m-%d')"
            git push
          fi

      - name: 3. Backup to Google Drive
        if: steps.check_status.outputs.status == 'success'
        continue-on-error: true
        env:
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          if [ -z "$GDRIVE_TOKEN" ]; then
            echo "⚠️ Google Drive Secrets (GDRIVE_TOKEN) missing."
          else
            shopt -s nullglob

            for db in private_db/db_*.db; do
              python upload_drive.py --files "$db" --folder "$GDRIVE_FOLDER_ID" --token "$GDRIVE_TOKEN"
            done

            for xlsx in *.xlsx; do
              python upload_drive.py --files "$xlsx" --folder "$GDRIVE_FOLDER_ID" --token "$GDRIVE_TOKEN"
            done
          fi

      - name: 4. Send Discord Notification
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          CURRENT_DATE=$(date +'%Y-%m-%d')
          DB_COUNT="${{ steps.check_status.outputs.db_count }}"
          EXCEL_OUTCOME="${{ steps.gen_excel.outcome }}"

          if [ "${{ steps.check_status.outputs.status }}" != "success" ]; then
            MSG="🚨 **[크롤링 실패]** $CURRENT_DATE DB 파일 생성/다운로드 실패 (db_*.db 없음). GitHub Actions 로그 확인!"
          else
            if [ "$EXCEL_OUTCOME" = "failure" ]; then
              MSG="⚠️ **[부분 성공]** $CURRENT_DATE 크롤링/DB($DB_COUNT개) OK ✅ / 엑셀 변환 실패 ❌\n☁️ Google Drive: https://drive.google.com/drive/folders/$GDRIVE_FOLDER_ID"
            else
              MSG="✅ **[크롤링 성공]** $CURRENT_DATE DB($DB_COUNT개) + 엑셀 변환 OK\n☁️ Google Drive: https://drive.google.com/drive/folders/$GDRIVE_FOLDER_ID"
            fi
          fi

          python send_discord.py --message "$MSG" --webhook "$DISCORD_WEBHOOK_URL"