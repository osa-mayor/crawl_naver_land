name: Daily Land Crawler

on:
  schedule:
    - cron: '0 16 * * 0,3'
  workflow_dispatch:

concurrency:
  group: daily-crawl
  cancel-in-progress: true

jobs:
  crawl:
    name: Crawl Shards ${{ matrix.shard_group }}
    runs-on: [self-hosted, macOS, crawl-naver-land]
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: 1
      PYTHONUNBUFFERED: 1
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard_group: ["0-3", "4-7", "8-11", "12-15", "16-19"]

    steps:
      - name: Checkout Public Code
        uses: actions/checkout@v4

      - name: Cache Python packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/requirements.txt') }}

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Install Playwright Browsers (Conditional)
        run: |
          python3 -m playwright install chromium

      - name: Run Crawler
        env:
          MAX_CONCURRENT_PAGES: 1
          MAX_API_PREFETCH_CONCURRENCY: 6
        run: |
          IFS='-' read -r SHARD_START SHARD_END <<< "${{ matrix.shard_group }}"
          failed=()

          for shard in $(seq "$SHARD_START" "$SHARD_END"); do
            echo "🚀 Processing Shard: ${shard}/20 (group ${{ matrix.shard_group }})"
            if ! python3 crawler.py --shard-index "$shard" --shard-total 20 --db-path "db_shard_${shard}.db"; then
              failed+=("$shard")
            fi
          done

          if [ "${#failed[@]}" -gt 0 ]; then
            printf '%s\n' "${failed[@]}" > failed_shards.txt
            echo "Failed shards: ${failed[*]}"
            exit 1
          fi

      - name: Upload Partial DB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partial-db-group-${{ matrix.shard_group }}
          path: db_shard_*.db
          if-no-files-found: warn
          retention-days: 1

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-group-${{ matrix.shard_group }}
          path: |
            crawling_db.log
            failed_shards.txt
          if-no-files-found: warn
          retention-days: 7


  archive-and-backup:
    needs: crawl
    runs-on: [self-hosted, macOS, crawl-naver-land]
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    if: always()

    steps:
      - name: Checkout Public Code (for scripts)
        uses: actions/checkout@v4

      - name: Checkout Private DB Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO_NAME }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: private_db

      - name: Install Dependencies
        run: |
          python3 -m pip install -r requirements.txt
          python3 -m pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Download All Partial DBs
        uses: actions/download-artifact@v4
        with:
          pattern: partial-db-*
          merge-multiple: true

      - name: Check Crawl Status
        id: check_status
        run: |
          shopt -s nullglob
          dbs=(db_shard_*.db)
          db_count=${#dbs[@]}
          if [ "$db_count" -gt 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "db_count=$db_count" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "db_count=0" >> "$GITHUB_OUTPUT"
          fi

      - name: 1. Merge Shards
        if: steps.check_status.outputs.status == 'success'
        run: |
          echo "🔄 Merging shards into master db..."
          python3 merge_db.py "db_shard_*.db" merged.db

      - name: 2. Generate Consolidated Excels
        id: gen_excel
        if: steps.check_status.outputs.status == 'success'
        continue-on-error: true
        run: |
          echo "📊 Generating Excel Reports..."
          date_str="$(date +'%Y-%m-%d')"

          echo "Processing Seoul..."
          python3 export_db.py merged.db --output "export_${date_str}_Seoul.xlsx" --min-households 100 --region "서울시"

          echo "Processing Gyeonggi..."
          python3 export_db.py merged.db --output "export_${date_str}_Gyeonggi.xlsx" --min-households 100 --region "경기도"

          echo "Processing Metros..."
          python3 export_db.py merged.db --output "export_${date_str}_Metros.xlsx" --min-households 100 --region "인천시 부산시 대구시 광주시 대전시 울산시 세종시"

          echo "Processing Provinces..."
          python3 export_db.py merged.db --output "export_${date_str}_Provinces.xlsx" --min-households 100 --region "강원도 충청북도 충청남도 경상북도 경상남도 전북도 전라남도 제주도"

      - name: 3. Archive to Private GitHub Repo
        if: steps.check_status.outputs.status == 'success'
        continue-on-error: true
        run: |
          cp merged.db private_db/
          pushd private_db
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add merged.db
          if ! git diff --staged --quiet; then
            git commit -m "Update DB: $(date +'%Y-%m-%d')"
            git push
          else
            echo "No changes to commit."
          fi
          popd

      - name: 4. Backup to Google Drive
        if: steps.check_status.outputs.status == 'success'
        continue-on-error: true
        env:
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          if [ -z "${GDRIVE_TOKEN:-}" ]; then
            echo "⚠️ Google Drive Secrets (GDRIVE_TOKEN) missing."
          else
            python3 upload_drive.py --files "merged.db" --folder "$GDRIVE_FOLDER_ID" --token "$GDRIVE_TOKEN"

            for file in *.xlsx; do
              [ -e "$file" ] || continue
              python3 upload_drive.py --files "$file" --folder "$GDRIVE_FOLDER_ID" --token "$GDRIVE_TOKEN"
            done
          fi

      - name: 4. Send Discord Notification
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          CURRENT_DATE="$(date +'%Y-%m-%d')"
          DB_COUNT="${{ steps.check_status.outputs.db_count }}"
          EXCEL_OUTCOME="${{ steps.gen_excel.outcome }}"

          if [ "${{ steps.check_status.outputs.status }}" != "success" ]; then
            MSG="🚨 **[크롤링 실패]** ${CURRENT_DATE} DB 파일 생성/다운로드 실패 (db_*.db 없음). GitHub Actions 로그 확인!"
          elif [ "$EXCEL_OUTCOME" = "failure" ]; then
            MSG="⚠️ **[부분 성공]** ${CURRENT_DATE} 크롤링/DB(${DB_COUNT}개) OK ✅ / 엑셀 변환 실패 ❌"
            MSG+=$'\n'
            MSG+="☁️ Google Drive: https://drive.google.com/drive/folders/${GDRIVE_FOLDER_ID}"
          else
            MSG="✅ **[크롤링 성공]** ${CURRENT_DATE} DB(${DB_COUNT}개) + 엑셀 변환 OK"
            MSG+=$'\n'
            MSG+="☁️ Google Drive: https://drive.google.com/drive/folders/${GDRIVE_FOLDER_ID}"
          fi

          python3 send_discord.py --message "$MSG" --webhook "$DISCORD_WEBHOOK_URL"
