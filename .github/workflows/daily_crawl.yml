name: Daily Land Crawler

on:
  schedule:
    # KST 01:00 AM = UTC 16:00 PM (Previous Day)
    - cron: '0 16 * * *'
  workflow_dispatch:  # Manual trigger allowed

jobs:
  crawl:
    name: Crawl ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Seoul"
            id: "seoul"
            regions: "서울시"
          - name: "Gyeonggi"
            id: "gyeonggi"
            regions: "경기도"
          - name: "Metros"
            id: "metros"
            regions: "인천시 부산시 대구시 광주시 대전시 울산시 세종시"
          - name: "Provinces"
            id: "provinces"
            regions: "강원도 충청북도 충청남도 전라북도 전라남도 경상북도 경상남도 제주도"

    steps:
      - name: Checkout Public Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache Python packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Playwright browsers
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/requirements.txt') }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: |
          playwright install chromium
          playwright install-deps

      - name: Run Crawler
        env:
          MAX_CONCURRENT_PAGES: 5
        run: |
          echo "🚀 Processing Regions: ${{ matrix.regions }}"
          # Run crawler with specific regions and unique DB output path
          python crawler.py --regions ${{ matrix.regions }} --db-path db_${{ matrix.id }}.db

      - name: Upload Partial DB
        uses: actions/upload-artifact@v4
        with:
          name: partial-db-${{ matrix.id }}
          path: db_${{ matrix.id }}.db
          retention-days: 1

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.id }}
          path: crawling_db.log

  archive-and-backup:
    needs: crawl
    runs-on: ubuntu-latest
    if: always() # Run even if crawl partially failed (to notify)
    steps:
      - name: Checkout Public Code (for scripts)
        uses: actions/checkout@v4

      - name: Checkout Private DB Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO_NAME }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: private_db
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Download All Partial DBs
        uses: actions/download-artifact@v4
        with:
          pattern: partial-db-*
          merge-multiple: true # Download all files to current dir
          
      - name: Check Crawl Status
        id: check_status
        run: |
          if [ -f "db_seoul.db" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
          fi

      - name: 1. Generate Excel Files (Skip if failed)
        if: steps.check_status.outputs.status == 'success'
        run: |
          echo "📊 Generating Excel files from Partial DBs..."
          for db_file in db_*.db; do
            id_name=$(echo "$db_file" | sed 's/db_//' | sed 's/.db//')
            date_str=$(date +'%Y-%m-%d')
            excel_name="${date_str}_${id_name}.xlsx"
            python export_db.py "$db_file" --output "$excel_name"
          done
          
      - name: 2. Archive to Private GitHub Repo (Split DBs)
        if: steps.check_status.outputs.status == 'success'
        run: |
          mv db_*.db private_db/
          cd private_db
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add db_*.db
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update DBs: $(date +'%Y-%m-%d')"
            git push
          fi
          
      - name: 3. Backup to Google Drive
        if: steps.check_status.outputs.status == 'success'
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          if [ -z "$GDRIVE_SA_KEY" ]; then
            echo "⚠️ Google Drive Secrets missing."
          else
            for db in private_db/db_*.db; do
               python upload_drive.py --files "$db" --folder "$GDRIVE_FOLDER_ID" --key "$GDRIVE_SA_KEY"
            done
            for xlsx in *.xlsx; do
               python upload_drive.py --files "$xlsx" --folder "$GDRIVE_FOLDER_ID" --key "$GDRIVE_SA_KEY"
            done
          fi

      - name: 4. Send Discord Notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          CURRENT_DATE=$(date +'%Y-%m-%d')
          
          if [ "${{ steps.check_status.outputs.status }}" == "success" ]; then
             MSG="✅ **[크롤링 성공]** $CURRENT_DATE 부동산 데이터 수집 완료!\n📁 엑셀 파일이 구글 드라이브에 업로드되었습니다.\n☁️ Google Drive: [바로가기](https://drive.google.com/drive/folders/${{ secrets.GDRIVE_FOLDER_ID }})"
          else
             MSG="🚨 **[크롤링 실패]** $CURRENT_DATE 데이터 수집 중 문제가 발생했습니다. GitHub Actions 로그를 확인해주세요."
          fi
          
          python send_discord.py --message "$MSG" --webhook "$DISCORD_WEBHOOK_URL"
