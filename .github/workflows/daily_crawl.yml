name: Daily Land Crawler

on:
  schedule:
    # KST 01:00 AM = UTC 16:00 PM (Previous Day)
    - cron: '0 16 * * *'
  workflow_dispatch:  # Manual trigger allowed

jobs:
  crawl:
    name: Crawl ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Seoul"
            id: "seoul"
            regions: "서울시"
          - name: "Gyeonggi"
            id: "gyeonggi"
            regions: "경기도"
          - name: "Metros"
            id: "metros"
            regions: "인천시 부산시 대구시 광주시 대전시 울산시 세종시"
          - name: "Provinces"
            id: "provinces"
            regions: "강원도 충청북도 충청남도 전라북도 전라남도 경상북도 경상남도 제주도"

    steps:
      - name: Checkout Public Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache Python packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Playwright browsers
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/requirements.txt') }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: |
          playwright install chromium
          playwright install-deps

      - name: Run Crawler
        env:
          MAX_CONCURRENT_PAGES: 5
        run: |
          echo "🚀 Processing Regions: ${{ matrix.regions }}"
          # Run crawler with specific regions and unique DB output path
          python crawler.py --regions ${{ matrix.regions }} --db-path db_${{ matrix.id }}.db

      - name: Upload Partial DB
        uses: actions/upload-artifact@v4
        with:
          name: partial-db-${{ matrix.id }}
          path: db_${{ matrix.id }}.db
          retention-days: 1

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.id }}
          path: crawling_db.log

  archive-and-backup:
    needs: crawl
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Public Code (for scripts)
        uses: actions/checkout@v4

      - name: Checkout Private DB Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO_NAME }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: private_db
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Google API Dependencies
        run: |
          pip install -r requirements.txt
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Download All Partial DBs
        uses: actions/download-artifact@v4
        with:
          pattern: partial-db-*
          merge-multiple: true # Download all files to current dir
          
      - name: 1. Generate Excel Files
        run: |
          echo "📊 Generating Excel files from Partial DBs..."
          for db_file in db_*.db; do
            # Extract ID from filename (db_seoul.db -> seoul)
            id_name=$(echo "$db_file" | sed 's/db_//' | sed 's/.db//')
            
            # Use current date in filename
            date_str=$(date +'%Y-%m-%d')
            excel_name="${date_str}_${id_name}.xlsx"
            
            echo "   Converting $db_file -> $excel_name"
            python export_db.py "$db_file" --output "$excel_name"
          done
          
      - name: 2. Archive to Private GitHub Repo (Split DBs)
        run: |
          # Move DB files to private_db folder
          mv db_*.db private_db/
          
          cd private_db
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          
          # Add all split DBs
          git add db_*.db
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update DBs: $(date +'%Y-%m-%d') (Split Storage)"
            git push
          fi
          
      - name: 3. Backup to Google Drive
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          if [ -z "$GDRIVE_SA_KEY" ] || [ -z "$GDRIVE_FOLDER_ID" ]; then
            echo "⚠️ Google Drive Secrets missing. Skipping Backup."
          else
            echo "🚀 Uploading to Google Drive..."
            # Upload DBs (from private_db) AND generated Excel files (from current dir)
            
            # 1. Upload DBs
            for db in private_db/db_*.db; do
               python upload_drive.py --files "$db" --folder "$GDRIVE_FOLDER_ID" --key "$GDRIVE_SA_KEY"
            done
            
            # 2. Upload Excel Files
            for xlsx in *.xlsx; do
               python upload_drive.py --files "$xlsx" --folder "$GDRIVE_FOLDER_ID" --key "$GDRIVE_SA_KEY"
            done
          fi
