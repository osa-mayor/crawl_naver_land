name: Test Naver Access

on:
  workflow_dispatch:

jobs:
  test:
    name: Test Naver Land Access
    runs-on: self-hosted

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Runner IP
        run: |
          echo "Runner IP Address:"
          curl.exe -s https://ifconfig.me
          echo ""

      - name: Test 1 - curl fin.land.naver.com
        continue-on-error: true
        run: |
          HTTP_CODE=$(curl.exe -s -o /dev/null -w "%{http_code}" -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0.0.0" --connect-timeout 30 --max-time 60 "https://fin.land.naver.com/regions?si=1100000000")
          echo "fin.land.naver.com -> HTTP $HTTP_CODE"

      - name: Test 2 - curl new.land.naver.com
        continue-on-error: true
        run: |
          HTTP_CODE=$(curl.exe -s -o /dev/null -w "%{http_code}" -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0.0.0" --connect-timeout 30 --max-time 60 "https://new.land.naver.com")
          echo "new.land.naver.com -> HTTP $HTTP_CODE"

      - name: Test 3 - curl naver.com (control)
        continue-on-error: true
        run: |
          HTTP_CODE=$(curl.exe -s -o /dev/null -w "%{http_code}" --connect-timeout 30 --max-time 60 "https://www.naver.com")
          echo "naver.com -> HTTP $HTTP_CODE"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Test 4 - Playwright browser test
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps
          python test_naver_connection.py
